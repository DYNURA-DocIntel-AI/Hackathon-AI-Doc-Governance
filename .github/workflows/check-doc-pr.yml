name: Check Documentation PR Merged

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: read
  contents: read

jobs:
  check-doc-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Require linked docs PR to be merged
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Docs PRs themselves must stay mergeable (they target the feature branch).
          if [[ "$HEAD_REF" == docs/pr-* ]] || [[ "$PR_TITLE" =~ ^docs: ]]; then
            echo "This is a documentation PR; skipping."
            exit 0
          fi

          DOCS_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all \
            --json number,title,state,mergedAt,headRefName \
            --jq "[.[] | select(.headRefName == \"docs/pr-${PR_NUMBER}\")] | .[0]")

          if [[ -z "$DOCS_PR" || "$DOCS_PR" == "null" ]]; then
            echo "No docs PR found (expected branch docs/pr-${PR_NUMBER}). Merge is blocked until DocIntelAI opens it."
            exit 1
          fi

          MERGED_AT=$(echo "$DOCS_PR" | jq -r '.mergedAt // empty')
          DOCS_NUM=$(echo "$DOCS_PR" | jq -r '.number')
          STATE=$(echo "$DOCS_PR" | jq -r '.state')

          if [[ -n "$MERGED_AT" ]]; then
            echo "Docs PR #${DOCS_NUM} is merged (${MERGED_AT}). Code PR can be merged."
            exit 0
          fi

          echo "Docs PR #${DOCS_NUM} exists but is not merged (state=${STATE}). Merge stays blocked."
          exit 1
