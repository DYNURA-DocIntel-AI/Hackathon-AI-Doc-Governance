name: Check Documentation PR Merged

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  check-doc-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check PR body for documentation link
        id: check
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          
          # Check if PR body contains a linked issue/PR
          if echo "$PR_BODY" | grep -iE "(closes|relates to|documentation|#[0-9]+)" > /dev/null; then
            echo "✅ Found documentation reference in PR body"
            echo "status=found" >> $GITHUB_OUTPUT
          else
            echo "❌ No documentation PR referenced"
            echo "status=not_found" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Skip check for documentation PRs
        id: is_doc_pr
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          
          if echo "$PR_TITLE" | grep -iE "(^docs|^documentation|^doc:)" > /dev/null; then
            echo "This is a documentation PR - skipping check"
            echo "is_doc=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "is_doc=false" >> $GITHUB_OUTPUT
      
      - name: Documentation check result
        run: |
          IS_DOC=${{ steps.is_doc_pr.outputs.is_doc }}
          STATUS=${{ steps.check.outputs.status }}
          
          if [ "$IS_DOC" = "true" ]; then
            echo "✅ This PR is a documentation PR - auto-passing"
          elif [ "$STATUS" = "found" ]; then
            echo "✅ Documentation reference found - PR can merge once doc is merged"
          else
            echo "❌ No documentation reference found"
            exit 1
          fi
